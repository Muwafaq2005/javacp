server.port=8787
spring.main.banner-mode=off
logging.level.org.springframework.web=INFO
# Loopback only: anyone who can reach this port can drive the browser and spend API credits.
# Override with -Dserver.address=0.0.0.0 on a trusted network (and add your origin below).
server.address=127.0.0.1
# Origins allowed to open the control WebSocket (blocks other websites from driving the browser)
voicebrowser.allowed-origins=http://localhost:[*],http://127.0.0.1:[*]
